# cargo-deny 0.20.2 policy. Empty targets evaluates every target-specific
# dependency represented by Cargo.lock; all-features includes optional edges.
[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
# No-safe-upgrade advisories: every entry below names a crate@version whose
# fix is unreachable in the resolved graph (no patched release exists on the
# requirement line any upstream dep accepts) or whose affected API is never
# called. Each reason is dated; prune entries when upstream moves.
ignore = [
  # bincode 1.3.3 via syntect 5.3.0 (latest): syntect's binary dump format
  # requires bincode 1.x; upstream ceased development (bincode 2.x is a
  # format-incompatible rewrite). Only exercised through syntect::dumps.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 via syntect 5.3.0; no patched bincode 1.x exists and syntect (latest) still requires it for dump (de)serialization. 2026-11-03" },
  # crypto-bigint 0.5.5 via elliptic-curve 0.13 -> p256/p384 -> dtls ->
  # webrtc (pi-voice). Constant-time fixes are only in crypto-bigint 0.7.6,
  # which needs the RustCrypto 0.14 line; latest webrtc/dtls still resolve
  # p256 0.13. Real but currently unfixable without forking webrtc.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via elliptic-curve 0.13 (p256/p384 -> dtls 0.17.2 -> webrtc 0.17.2, pi-voice); fix is crypto-bigint 0.7.6 on the RustCrypto 0.14 line, which latest webrtc does not use yet. 2026-11-03" },
  # paste 1.0.15 via gemm (candle-core 0.9.2): proc-macro at build time;
  # gemm 0.19 (latest) still requires it and candle-core is pinned to 0.9.x
  # (see workspace Cargo.toml: 0.10+ pulls onig via tokenizers).
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 via gemm (candle-core 0.9.2, pinned); latest gemm 0.19 still requires paste and there is no replacement. 2026-11-03" },
  # ttf-parser 0.25.1 via fontdue 0.9.4 (latest): unmaintained upstream;
  # fontdue has no release moving off it.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 via fontdue 0.9.4 (latest); unmaintained upstream with no fontdue release off it. 2026-11-03" },
  # yaml-rust 0.4.5 via syntect 5.3.0 (latest) yaml-load feature: unmaintained
  # upstream with no syntect release moving off it.
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust 0.4.5 via syntect 5.3.0 (latest) yaml-load feature; no syntect release moves off it. 2026-11-03" },
  # zbus 5 stack (zvariant 5.15.0 / zvariant_derive 5.15.0 / zbus_names
  # 4.3.4) via ashpd/atspi/xcap in pi-natives: the whole zbus 5 line is
  # unmaintained; latest ashpd 0.13.13 and xcap 0.9.8 still require zbus 5.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.0 via zbus 5.19 (ashpd/atspi/xcap, pi-natives); zbus 5 stack is unmaintained and no patched zvariant exists yet. 2026-11-03" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 via zbus 5.19 (ashpd/atspi/xcap, pi-natives); zbus 5 stack is unmaintained and no patched release exists yet. 2026-11-03" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.0 via zvariant 5.15.0 (zbus 5.19, pi-natives); zbus 5 stack is unmaintained and no patched release exists yet. 2026-11-03" },
  # zip 7.2.0 via candle-core 0.9.2 (^7.2.0): all four advisories live in
  # ZipArchive::extract / ZipStreamReader::extract, which candle never calls
  # (it only reads npz entries, candle-core/src/npy.rs) and pi-predict loads
  # safetensors only. zip 9 requires candle-core 0.10+, which is pinned out
  # (see workspace Cargo.toml: 0.10+ pulls onig via tokenizers).
  { id = "RUSTSEC-2026-0367", reason = "zip 7.2.0 via candle-core 0.9.2 (npz loader, extract() never called; candle pinned below 0.10 because 0.10+ pulls onig). 2026-11-03" },
  { id = "RUSTSEC-2026-0368", reason = "zip 7.2.0 via candle-core 0.9.2 (npz loader, extract() never called; candle pinned below 0.10 because 0.10+ pulls onig). 2026-11-03" },
  { id = "RUSTSEC-2026-0369", reason = "zip 7.2.0 via candle-core 0.9.2 (npz loader, extract() never called; candle pinned below 0.10 because 0.10+ pulls onig). 2026-11-03" },
  { id = "RUSTSEC-2026-0429", reason = "zip 7.2.0 via candle-core 0.9.2 (npz loader, extract() never called; candle pinned below 0.10 because 0.10+ pulls onig). 2026-11-03" },
]

[licenses]
version = 2
include-dev = true
include-build = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
confidence-threshold = 0.8
# cargo-deny evaluates SPDX expressions existentially across OR and
# conjunctively across AND: a permissive OR branch may be selected, but every
# obligation in the selected branch must be allowed.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
# inferno is CDDL-1.0-licensed. Keep this
# package-scoped: distributions disclose source availability in the native
# addon's notices (packages/natives/THIRD-PARTY-NOTICES.txt) rather than
# globally admitting CDDL dependencies.
exceptions = [
  { allow = ["CDDL-1.0"], crate = "inferno@0.12.8" },
  { allow = ["WTFPL"], crate = "terminfo@0.9.0" },
  # uluru (via pi-vcs → jj-lib → gix → gix-pack) is MPL-2.0: file-level
  # copyleft, satisfied by upstream source availability; no obligations
  # attach to our unmodified use. Keep it package-scoped like inferno.
  { allow = ["MPL-2.0"], crate = "uluru@3.1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
