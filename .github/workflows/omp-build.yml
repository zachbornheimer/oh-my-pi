name: omp-build

# Assembles the custom `omp` from upstream main plus the topic branches in
# .github/omp-rebuild.toml, builds darwin-arm64 and linux-x64 binaries, and
# publishes them as a GitHub release marked latest. Any merge conflict fails
# the assembly, opens/updates one issue naming the branch and its conflicting
# files, and leaves the previous release as latest.
#
# Runs from the fork's default branch (`ci`): `schedule` events only fire on
# the default branch, and `main` stays a read-only upstream mirror.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branches_override:
        description: "Comma-separated branch list (empty string = no branches; scheduled runs use .github/omp-rebuild.toml)"
        type: string
        default: ""

concurrency:
  group: omp-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Merges upstream main + the branch list into a fresh omp-build tree and
  # pushes it to the fork. Skips the build when the resulting tree equals the
  # tree of the latest release's recorded build commit.
  assemble:
    name: Assemble omp-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      build-sha: ${{ steps.decide.outputs.build-sha }}
      upstream-sha: ${{ steps.decide.outputs.upstream-sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The ci branch: branch list + this workflow.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Resolve branch list
        id: branches
        env:
          BRANCHES_OVERRIDE: ${{ inputs.branches_override }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            bun scripts/omp-build/resolve-branches.ts "$BRANCHES_OVERRIDE" "$EVENT_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Upstream main is the assembly base; full history for --no-ff merges
      # and for resolving the recorded build commit of the latest release.
      - name: Check out upstream main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: can1357/oh-my-pi
          ref: main
          fetch-depth: 0
          path: upstream
          persist-credentials: false

      - name: Merge topic branches into omp-build
        id: merge
        env:
          BRANCHES: ${{ steps.branches.outputs.list }}
          FORK_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          cd upstream
          git config user.name "omp-build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add fork "$FORK_URL"
          # Lease base: the omp-build tip this run replaces.
          lease=(--force)
          if git fetch fork refs/heads/omp-build:refs/remotes/fork/omp-build 2>/dev/null; then
            lease=(--force-with-lease="refs/heads/omp-build:$(git rev-parse refs/remotes/fork/omp-build)")
          fi
          printf '%s\n' "${lease[@]}" > "$RUNNER_TEMP/lease.txt"
          upstream_sha="$(git rev-parse refs/remotes/origin/main)"
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if ! git fetch fork "refs/heads/$branch"; then
              echo "::error title=Missing branch::$branch is not on ${{ github.repository }}"
              exit 1
            fi
            if ! git merge --no-ff --no-edit "refs/remotes/fork/$branch"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicts" ]; then
                echo "::error title=Merge failed::git merge $branch failed without unmerged paths"
                exit 1
              fi
              {
                printf "The omp-build assembly failed: \`%s\` conflicts with upstream main (\`%s\`).\\n\\nConflicting files:\\n" "$branch" "$upstream_sha"
                printf -- '- %s\n' "$conflicts"
              } > issue-body.txt
              # Exactly one open issue per conflicting branch, edited on repeat failures.
              existing="$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"omp-build: $branch conflicts with upstream\") | .number" | head -1)"
              if [ -n "$existing" ]; then
                gh issue edit "$existing" --body-file issue-body.txt
              else
                gh issue create --title "omp-build: $branch conflicts with upstream" --body-file issue-body.txt
              fi
              echo "::error title=Conflict::omp-build: $branch conflicts with upstream (issue opened/updated)"
              exit 1
            fi
          done <<< "$BRANCHES"

      - name: Decide skip and record shas
        id: decide
        run: |
          set -euo pipefail
          cd upstream
          build_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse refs/remotes/origin/main)"
          skip=false
          # The release body records `build_commit:`; an identical tree means
          # the latest release already ships this assembly.
          recorded="$(gh release view --json body --jq .body 2>/dev/null | grep -oE 'build_commit: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)"
          if [ -n "$recorded" ] && git cat-file -e "$recorded^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse "$recorded^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              skip=true
            fi
          fi
          {
            echo "skip=$skip"
            echo "build-sha=$build_sha"
            echo "upstream-sha=$upstream_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Push omp-build to the fork
        if: steps.decide.outputs.skip != 'true'
        env:
          FORK_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mapfile -t lease < "$RUNNER_TEMP/lease.txt"
          cd upstream && git push "${lease[@]}" "$FORK_URL" HEAD:refs/heads/omp-build

  # One build per target on its native runner: natives addon + compiled omp
  # binary from the assembled tree, `--version` checked, `omp` tarred alone.
  build:
    name: Build omp (${{ matrix.target }})
    needs: assemble
    if: needs.assemble.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-14 }
          - { target: linux-x64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: omp-build
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: omp-build-bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      # `host` builds the addon for this runner through the local Cargo/N-API
      # path — no bazel needed; the compiled binary embeds it.
      - name: Build native addon
        run: bun scripts/bazel-natives.ts host
      - name: Build omp binary
        run: bun --cwd=packages/coding-agent run build
      - name: Check omp --version
        run: ./packages/coding-agent/dist/omp --version
      - name: Tar omp
        run: tar -czf "${{ runner.temp }}/omp-${{ matrix.target }}.tar.gz" -C packages/coding-agent/dist omp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-${{ matrix.target }}.tar.gz
          path: ${{ runner.temp }}/omp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Publishes the release per the distribution contract: tag
  # build-<YYYYMMDD>-<upstream7>-<build7>, both tarballs + SHA256SUMS, latest.
  release:
    name: Publish release
    needs: [assemble, build]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.assemble.outputs.skip != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Checksum assets
        run: |
          set -euo pipefail
          cd assets
          ls -l
          sha256sum omp-darwin-arm64.tar.gz omp-linux-x64.tar.gz > SHA256SUMS
      - name: Create release
        env:
          BUILD_SHA: ${{ needs.assemble.outputs.build-sha }}
          UPSTREAM_SHA: ${{ needs.assemble.outputs.upstream-sha }}
        run: |
          set -euo pipefail
          tag="build-$(date -u +%Y%m%d)-${UPSTREAM_SHA:0:7}-${BUILD_SHA:0:7}"
          body="Custom \`omp\` assembled from can1357/oh-my-pi main plus the branches in \`.github/omp-rebuild.toml\`.

          build_commit: $BUILD_SHA
          upstream_commit: $UPSTREAM_SHA"
          gh release create "$tag" \
            --target "$BUILD_SHA" \
            --latest \
            --title "$tag" \
            --notes "$body" \
            assets/omp-darwin-arm64.tar.gz assets/omp-linux-x64.tar.gz assets/SHA256SUMS
          echo "published $tag"
