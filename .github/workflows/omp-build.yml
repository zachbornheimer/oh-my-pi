name: omp-build

# Assembles the custom `omp` from the PINNED upstream base
# (.github/omp-upstream.txt on this branch) plus every branch listed in this
# workflow's BRANCH_MANIFEST, builds darwin-arm64 and linux-x64 binaries, and
# publishes them as a GitHub release marked latest. A merge conflict with
# the pinned base — or a configured branch missing from the fork — fails
# the assembly with a `::error` annotation naming the branch and opens or
# updates one `omp-rebuild`-labelled issue naming the branch (and, on a
# conflict, its conflicting files), and leaves the previous release as
# latest.
#
# The pin, never upstream main HEAD, is the assembly base: a scheduled run
# does not chase upstream and fails only on a conflict with the pinned base,
# never merely because upstream moved. Bump the pin deliberately - every few
# days, after a clean local probe - by committing a new SHA to
# .github/omp-upstream.txt on `ci`; a workflow_dispatch `upstream_base` input
# tests a candidate base without committing it.
#
# Override guard: a workflow_dispatch with a non-empty branches_override OR a
# non-empty upstream_base publishes a PRERELEASE (mise ignores prereleases)
# and never --latest, so a candidate build can never become the stable one; a
# normal run whose assembled SHA equals the pinned base SHA fails instead of
# publishing.
#
# Runs from the fork's default branch (`ci`): `schedule` events only fire on
# the default branch, and `main` stays a read-only upstream mirror.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branches_override:
        description: "Comma-separated branch list (non-empty publishes a prerelease mise ignores, never latest; empty uses this workflow's BRANCH_MANIFEST)"
        type: string
        default: ""
      upstream_base:
        description: "Upstream commit SHA to assemble onto instead of the pin in .github/omp-upstream.txt (tests a candidate base without committing it; empty uses the pin)"
        type: string
        default: ""

concurrency:
  group: omp-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Merges upstream main + the branch list into a fresh omp-build tree and
  # pushes it to the fork. Skips the build when the resulting tree equals the
  # tree of the latest release's recorded build commit.
  assemble:
    name: Assemble omp-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      build-sha: ${{ steps.decide.outputs.build-sha }}
      upstream-sha: ${{ steps.decide.outputs.upstream-sha }}
      override: ${{ steps.decide.outputs.override }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # THE BRANCH MANIFEST - the single source of truth for what this build
      # merges. One entry per branch, each with the plain-English reason it
      # exists: what it does for the person running this build. Adding a
      # branch means adding an entry here and nothing else. An entry without a
      # reason fails the run (scripts/omp-build/resolve-branches.ts), so the
      # list can never grow a branch nobody can explain.
      #
      # Order matters: entries merge in listed order, so a branch another entry
      # already contains, or one that must land on top of another, has to sit
      # in the right place.
      BRANCH_MANIFEST: |
        [
          {
            "branch": "feat/browser-aria-ref-delegation",
            "reason": "Browser automation can target a page element by its ref name, not only by a CSS selector."
          },
          {
            "branch": "feat/sql-session-listing",
            "reason": "Sessions are found and resumed when they live in SQL storage, not only in files."
          },
          {
            "branch": "feat/capability-job-rows",
            "reason": "Capability gateway job tools - starting or waiting on a background job - show as one compact status row instead of the MCP card."
          },
          {
            "branch": "feat/tui-quarantine-cursor-controls",
            "reason": "A program that prints odd cursor-control codes cannot corrupt what the terminal shows."
          },
          {
            "branch": "fix/blocked-mcp-calls-render-label",
            "reason": "A blocked MCP call shows a readable label instead of looking like an empty line."
          },
          {
            "branch": "fix/run-command-native-render",
            "reason": "A run_command call draws as a shell card showing the command and its output, instead of a six-field data tree."
          },
          {
            "branch": "perf/startup-rules-early",
            "reason": "Rules load earlier during startup, so omp starts sooner."
          },
          {
            "branch": "feat/tools-disabled-clean",
            "reason": "Turns off the harness's duplicate copies of tools the capability server already provides, so the capability versions behave like built-in tools."
          },
          {
            "branch": "feat/capability-wake-custom-path",
            "reason": "A finished background job shows as one short status row instead of a raw JSON panel."
          },
          {
            "branch": "fix/omp-rpc-golangci",
            "reason": "The omp-rpc Go module passes its own golangci gate instead of failing it on 28 findings."
          },
          {
            "branch": "feat/esc-instant-interrupt",
            "reason": "Pressing Escape ends the run immediately, even while a tool call is in flight, instead of waiting for the running tool to finish first."
          },
          {
            "branch": "fix/sql-session-rewrite-conflict",
            "reason": "A SQL-backed session (SESSIONS_DB_URL) stops failing with Session file changed before rewrite on every turn, and a session another writer changed is read back instead of staying latched."
          }
        ]
    steps:
      # The ci branch: branch list + this workflow.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Resolve branch list
        id: branches
        env:
          BRANCHES_OVERRIDE: ${{ inputs.branches_override }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            bun scripts/omp-build/resolve-branches.ts "$BRANCHES_OVERRIDE" "$EVENT_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve upstream base
        id: base
        env:
          UPSTREAM_BASE_OVERRIDE: ${{ inputs.upstream_base }}
        run: |
          set -euo pipefail
          if [ -n "$UPSTREAM_BASE_OVERRIDE" ]; then
            base="$UPSTREAM_BASE_OVERRIDE"
          else
            base="$(grep -m1 -oE '[0-9a-f]{40}' .github/omp-upstream.txt || true)"
          fi
          # A full-hex SHA only: the value becomes a checkout ref and part of
          # the release tag, so refuse anything else outright.
          echo "$base" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error title=Bad upstream base::not a full commit SHA: $base (pin .github/omp-upstream.txt or pass a 40-hex upstream_base)"
            exit 1
          }
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # The pinned upstream base (.github/omp-upstream.txt) is the assembly
      # base; full history for --no-ff merges and for resolving the recorded
      # build commit of the latest release.
      - name: Check out the pinned upstream base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: can1357/oh-my-pi
          ref: ${{ steps.base.outputs.sha }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false

      - name: Merge topic branches into omp-build
        id: merge
        env:
          BRANCHES: ${{ steps.branches.outputs.list }}
          UPSTREAM_BASE: ${{ steps.base.outputs.sha }}
          FORK_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # One owner of loud failure, shared by the missing-branch and
          # conflict paths: a `::error` annotation naming the branch, then
          # exactly one open `omp-rebuild`-labelled issue per branch and
          # failure kind (created once, body edited on repeat failures, so
          # an already-open tracking issue is updated rather than
          # duplicated), then a non-zero exit that leaves the previous
          # release as latest.
          fail_loudly() { # <annotation-title> <annotation-detail> <issue-title> <issue-body-file>
            echo "::error title=$1::$2"
            gh label create omp-rebuild --description "omp-build assembly failure tracking" --color b60205 2>/dev/null || true
            existing="$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$3\") | .number" | head -1)"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$4" --add-label omp-rebuild
            else
              gh issue create --title "$3" --body-file "$4" --label omp-rebuild
            fi
            exit 1
          }
          cd upstream
          git config user.name "omp-build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add fork "$FORK_URL"
          # Lease base: the omp-build tip this run replaces.
          lease=(--force)
          if git fetch fork refs/heads/omp-build:refs/remotes/fork/omp-build 2>/dev/null; then
            lease=(--force-with-lease="refs/heads/omp-build:$(git rev-parse refs/remotes/fork/omp-build)")
          fi
          printf '%s\n' "${lease[@]}" > "$RUNNER_TEMP/lease.txt"
          upstream_sha="$UPSTREAM_BASE"
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if ! git fetch fork "refs/heads/$branch"; then
              {
                printf "The omp-build assembly failed: configured branch \`%s\` does not exist on \`%s\` — \`git fetch fork refs/heads/%s\` found nothing.\\n\\n" "$branch" "${{ github.repository }}" "$branch"
                printf "Push the branch to the fork, or delete its entry in this workflow's \`BRANCH_MANIFEST\` on \`ci\`, then re-run \`omp-build\`.\\n\\n"
                printf "Failed run: %s\\n" "$RUN_URL"
              } > issue-body.txt
              fail_loudly "Missing branch" "$branch is not on ${{ github.repository }}" "omp-build: $branch is missing from the fork" issue-body.txt
            fi
            if ! git merge --no-ff --no-edit "refs/remotes/fork/$branch"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicts" ]; then
                echo "::error title=Merge failed::git merge $branch failed without unmerged paths"
                exit 1
              fi
              {
                printf "The omp-build assembly failed: \`%s\` conflicts with the pinned upstream base (\`%s\`).\\n\\nConflicting files:\\n" "$branch" "$upstream_sha"
                while IFS= read -r file; do
                  printf -- '- %s\n' "$file"
                done <<< "$conflicts"
                printf "\\nRebase the branch onto the pinned base, or remove its entry in this workflow's \`BRANCH_MANIFEST\` on \`ci\`, then re-run \`omp-build\`.\\n\\n"
                printf "Failed run: %s\\n" "$RUN_URL"
              } > issue-body.txt
              fail_loudly "Conflict" "omp-build: $branch conflicts with upstream" "omp-build: $branch conflicts with upstream" issue-body.txt
            fi
          done <<< "$BRANCHES"

      - name: Decide skip and record shas
        id: decide
        env:
          # Any dispatch override - a branch list OR a candidate upstream base -
          # publishes a prerelease, never latest: an override must never be
          # able to become what mise installs as the stable build.
          OVERRIDE_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.branches_override != '' || inputs.upstream_base != '') }}
          UPSTREAM_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          cd upstream
          build_sha="$(git rev-parse HEAD)"
          upstream_sha="$UPSTREAM_BASE"
          # A normal run that assembles the pinned base alone is branchless:
          # fail instead of publishing it as what mise installs.
          if [ "$OVERRIDE_RUN" != "true" ] && [ "$build_sha" = "$upstream_sha" ]; then
            echo "::error title=Branchless assembly::assembled SHA $build_sha equals the pinned upstream base SHA $upstream_sha - a normal run must merge the configured branches"
            exit 1
          fi
          skip=false
          # The release body records `build_commit:`; an identical tree means
          # the latest release already ships this assembly.
          recorded="$(gh release view --json body --jq .body 2>/dev/null | grep -oE 'build_commit: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)"
          if [ -n "$recorded" ] && git cat-file -e "$recorded^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse "$recorded^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              skip=true
            fi
          fi
          {
            echo "skip=$skip"
            echo "build-sha=$build_sha"
            echo "upstream-sha=$upstream_sha"
            echo "override=$OVERRIDE_RUN"
          } >> "$GITHUB_OUTPUT"

      - name: Push omp-build to the fork
        if: steps.decide.outputs.skip != 'true'
        env:
          FORK_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mapfile -t lease < "$RUNNER_TEMP/lease.txt"
          cd upstream && git push "${lease[@]}" "$FORK_URL" HEAD:refs/heads/omp-build

  # One build per target on its native runner: natives addon + compiled omp
  # binary from the assembled tree, `--version` checked, `omp` tarred alone.
  build:
    name: Build omp (${{ matrix.target }})
    needs: assemble
    if: needs.assemble.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-14 }
          - { target: linux-x64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: omp-build
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: omp-build-bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      # Exact addon hit (Rust inputs unchanged) skips the ~19-minute N-API
      # build entirely: the .node plus the committed native/index.* bindings
      # are all the binary build consumes.
      - name: Restore native addon
        id: addon-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/natives/native/*.node
          key: omp-build-addon-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'rust-toolchain.toml', '.cargo/**', 'packages/natives/scripts/**', 'packages/natives/package.json') }}
      # `host` builds the addon for this runner through the local Cargo/N-API
      # path — no bazel needed; the compiled binary embeds it. On a miss the
      # Cargo cache limits recompilation to crates that actually changed.
      - name: Restore Cargo build cache
        if: steps.addon-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build native addon
        if: steps.addon-cache.outputs.cache-hit != 'true'
        run: bun scripts/bazel-natives.ts host
      - name: Build omp binary
        run: bun --cwd=packages/coding-agent run build
      - name: Check omp --version
        run: ./packages/coding-agent/dist/omp --version
      - name: Tar omp
        run: tar -czf "${{ runner.temp }}/omp-${{ matrix.target }}.tar.gz" -C packages/coding-agent/dist omp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-${{ matrix.target }}.tar.gz
          path: ${{ runner.temp }}/omp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Publishes the release per the distribution contract: tag
  # build-<YYYYMMDDHHMMSS>-<upstream7>-<build7>, both tarballs + SHA256SUMS;
  # latest for normal runs, prerelease (never latest) for branches_override
  # dispatches. The UTC timestamp is one numeric chunk so mise's version order
  # is publish order, also against the older build-<YYYYMMDD>-* tags.
  release:
    name: Publish release
    needs: [assemble, build]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.assemble.outputs.skip != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Checksum assets
        run: |
          set -euo pipefail
          cd assets
          ls -l
          sha256sum omp-darwin-arm64.tar.gz omp-linux-x64.tar.gz > SHA256SUMS
      - name: Create release
        env:
          BUILD_SHA: ${{ needs.assemble.outputs.build-sha }}
          UPSTREAM_SHA: ${{ needs.assemble.outputs.upstream-sha }}
          OVERRIDE_RUN: ${{ needs.assemble.outputs.override }}
        run: |
          set -euo pipefail
          tag="build-$(date -u +%Y%m%d%H%M%S)-${UPSTREAM_SHA:0:7}-${BUILD_SHA:0:7}"
          body="Custom \`omp\` assembled from the pinned can1357/oh-my-pi base plus the branches in the workflow's \`BRANCH_MANIFEST\`.

          build_commit: $BUILD_SHA
          upstream_commit: $UPSTREAM_SHA"
          # A branches_override dispatch publishes a prerelease (mise ignores
          # prereleases) and never the latest release.
          if [ "$OVERRIDE_RUN" = "true" ]; then
            release_args=(--prerelease)
          else
            release_args=(--latest)
          fi
          gh release create "$tag" \
            --target "$BUILD_SHA" \
            "${release_args[@]}" \
            --title "$tag" \
            --notes "$body" \
            assets/omp-darwin-arm64.tar.gz assets/omp-linux-x64.tar.gz assets/SHA256SUMS
          echo "published $tag"
