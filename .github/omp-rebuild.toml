# Declarative rebuild configuration for custom oh-my-pi (`omp`) builds.
#
# INVARIANTS:
# 1. `main` on zachbornheimer/oh-my-pi MUST remain 100% identical to upstream
#    `origin/main` (can1357/oh-my-pi). Direct commits or merges onto `main`
#    are forbidden and mechanically blocked.
# 2. Every custom feature or fix lives on its own named branch on the fork,
#    branched off upstream `origin/main`.
# 3. The scheduled `omp-build` workflow rebuilds `omp-build` from scratch in a
#    checkout of the PINNED upstream base (.github/omp-upstream.txt), never
#    upstream `origin/main` HEAD: it merges ONLY the branches listed in the
#    BRANCH_MANIFEST inside .github/workflows/omp-build.yml, in the order given
#    there, then builds the `omp` binaries from that tree. Every manifest entry
#    carries a plain-English reason, and an entry without one fails the run, so
#    the list cannot grow a branch nobody can explain. On any merge conflict —
#    or a configured branch missing on the fork — the run fails loudly: a
#    `::error` annotation naming the branch, plus exactly one open
#    `omp-rebuild`-labelled issue naming the branch (and, on a conflict, its
#    conflicting files), and no release is published. The previous release
#    stays `latest`. A scheduled run never fails merely because upstream
#    moved; the pin is bumped deliberately (see .github/omp-upstream.txt).
# 4. To add a branch to the custom omp build: push the branch to the fork and
#    add an entry (branch + reason) to BRANCH_MANIFEST in
#    .github/workflows/omp-build.yml on the `ci` branch. Nothing else.
#    To remove one: delete its manifest entry.
#
# This file no longer holds the branch list — BRANCH_MANIFEST in the workflow
# is the single source of truth, so there is exactly one place to edit.

upstream_remote = "origin"
upstream_branch = "main"
fork_remote = "fork"
build_branch = "omp-build"
