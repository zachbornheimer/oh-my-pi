# Declarative rebuild configuration for custom oh-my-pi (`omp`) builds.
#
# INVARIANTS:
# 1. `main` on zachbornheimer/oh-my-pi MUST remain 100% identical to upstream
#    `origin/main` (can1357/oh-my-pi). Direct commits or merges onto `main`
#    are forbidden and mechanically blocked.
# 2. Every custom feature or fix lives on its own named branch on the fork,
#    branched off upstream `origin/main`.
# 3. The scheduled `omp-build` workflow rebuilds `omp-build` from scratch in
#    a checkout of the PINNED upstream base (.github/omp-upstream.txt), never
#    upstream `origin/main` HEAD: it merges ONLY the branches listed in
#    `branches` below, in order, then builds the `omp` binaries from that tree.
#    On any merge conflict — or a configured branch missing on the fork — it
#    opens/updates one GitHub issue naming the branch and the conflicting files
#    and exits non-zero without publishing a release. The previous release
#    stays `latest`. A scheduled run never fails merely because upstream
#    moved; the pin is bumped deliberately (see .github/omp-upstream.txt).
# 4. To add a branch to the custom omp build: push the branch to the fork and
#    append it to `branches` below (then commit on the `ci` branch).
#    To remove one: delete the entry.

upstream_remote = "origin"
upstream_branch = "main"
fork_remote = "fork"
build_branch = "omp-build"

# Minimal covering list, merged in order. feat/browser-aria-ref-delegation is
# the stack top and carries its ancestors (capability-channel-and-deferral,
# auto-fallback-shake, fleet-and-xdev-fixes). feat/sql-session-listing carries
# omp-neon-sessions (83ac6fd879), feat/extension-shake,
# feat/isolation-command-backend and the feat/browser-aria-ref-delegation
# stack (all proven ancestors of 4d5e83521e), so those branches need no
# entries of their own; sql merges strictly AFTER aria so the aria tree is
# assembled first and the sql merge lands on top of it.
# feat/capability-job-rows contains the aria tree (merged in to resolve its
# conflict in mcp/tool-bridge.ts), so it merges last.
branches = [
  "feat/browser-aria-ref-delegation",
  "feat/sql-session-listing",
  "feat/capability-job-rows",
  "feat/tui-quarantine-cursor-controls",
]
